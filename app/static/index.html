<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>YT Audio</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <section id="login-view" class="login-view" hidden>
    <form id="login-form" class="login-card">
      <h1>YT Audio</h1>
      <label for="password">Hasło</label>
      <input type="password" id="password" autocomplete="current-password" required maxlength="1024" autofocus>
      <button type="submit" id="login-btn">Zaloguj</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <div id="app-view" hidden>
    <header class="topbar">
      <a href="#/" class="brand">YT Audio</a>
      <form id="search-form" class="search" role="search">
        <input type="search" id="search-input" placeholder="Szukaj, wpisz @kanał albo wklej link" required maxlength="200" aria-label="Szukaj">
        <button type="submit">Szukaj</button>
      </form>
      <select id="quality" class="quality" aria-label="Jakość odtwarzania" title="Jakość odtwarzania">
        <option value="audio">Audio</option>
        <option value="360">360p</option>
        <option value="720">720p</option>
        <option value="1080">1080p</option>
      </select>
      <button type="button" id="logout-btn" class="ghost">Wyloguj</button>
    </header>

    <main class="content">
      <section id="video-panel" class="video-panel" hidden>
        <video id="video" controls playsinline preload="none"></video>
        <div id="seek-row" class="seek-row" hidden>
          <input type="range" id="seek" min="0" max="0" step="1" value="0" aria-label="Pozycja w filmie">
          <span id="seek-time" class="seek-time"></span>
        </div>
      </section>

      <section id="favorites" class="favorites" hidden>
        <h2 class="list-title">Ulubione kanały</h2>
        <ul id="favorites-list" class="fav-list"></ul>
        <p id="favorites-empty" class="status">Nie masz jeszcze ulubionych. Otwórz kanał i kliknij ☆ obok jego nazwy.</p>
      </section>

      <div class="list-header">
        <h2 id="list-title" class="list-title"></h2>
        <button type="button" id="fav-btn" class="ghost fav-btn" hidden></button>
      </div>
      <p id="status" class="status" role="status"></p>
      <ul id="results" class="results"></ul>
      <button type="button" id="more-btn" class="more" hidden>Załaduj więcej</button>
    </main>

    <footer id="player" class="player" hidden>
      <img id="np-thumb" class="np-thumb" alt="">
      <div class="np-info">
        <div id="np-title" class="np-title"></div>
        <div id="np-channel" class="np-channel"></div>
      </div>
      <div class="np-controls">
        <button type="button" id="prev-btn" class="ghost icon" title="Poprzedni" aria-label="Poprzedni">⏮</button>
        <audio id="audio" controls preload="none"></audio>
        <button type="button" id="next-btn" class="ghost icon" title="Następny" aria-label="Następny">⏭</button>
      </div>
    </footer>
  </div>
</body>
</html>
